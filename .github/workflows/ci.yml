name: DevOps CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run echo command
        run: echo "CI pipeline is working!"
      - name: List files in repo
        run: ls -ld
      - name: Check OS and username
        run: |
            whoami
            pwd
            sudo systemctl start ssh
            sudo systemctl enable ssh
            sudo systemctl status ssh
      - name: Read application file
        run: cat app.txt
      - name: Failure altert
        run: exit 1
      - name: Runs only in main branch
        if: github.ref == 'ref/heads/main'
        run: echo "Runing in main branch"
